name: Build and Release VMNexus

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install QEMU
        run: brew install qemu

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build VMNexus
        run: |
          xcodebuild -project VMNexus.xcodeproj \
            -scheme VMNexus \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package DMG
        run: |
          mkdir -p dmg
          APP_PATH=$(find build/DerivedData/Build/Products/Release -name "VMNexus.app" -maxdepth 1 | head -1)
          DMG_TEMP=$(mktemp -d)
          cp -R "$APP_PATH" "$DMG_TEMP/"
          ln -s /Applications "$DMG_TEMP/Applications"
          VERSION=${GITHUB_REF_NAME:-1.0.0}
          hdiutil create -volname "VMNexus" \
            -srcfolder "$DMG_TEMP" \
            -ov -format UDZO \
            "dmg/VMNexus-${VERSION}.dmg"
          rm -rf "$DMG_TEMP"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMNexus-DMG
          path: dmg/VMNexus-*.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dmg/VMNexus-*.dmg
          name: "VMNexus ${{ github.ref_name }}"
          body: |
            ## VMNexus ${{ github.ref_name }}
            
            ### What's New
            - QEMU-based virtual machine manager for macOS
            - Support for 29+ architectures (8-bit AVR to 64-bit x86_64)
            - Native macOS app with Objective-C/Swift frontend
            - Virtual machine library management
            - Built-in console with QEMU monitor access
            
            ### Requirements
            - macOS 14.0 or later
            - QEMU (`brew install qemu`)
            
            ### Installation
            1. Download the DMG file
            2. Drag VMNexus.app to Applications
            3. Install QEMU: `brew install qemu`
            4. Launch VMNexus
            
            ### License
            GPLv2 - See LICENSE file
          draft: false
          prerelease: false

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows EXE
        run: |
          cd VMNexus-Windows/VMNexus
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../../publish

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMNexus-Windows
          path: publish/VMNexus.exe

      - name: Create Windows Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: publish/VMNexus.exe
          name: "VMNexus ${{ github.ref_name }}"
          body: |
            ## VMNexus ${{ github.ref_name }} - Windows
            
            ### Installation
            1. Download VMNexus.exe
            2. Run the executable
            3. Follow the setup wizard
            
            ### Requirements
            - Windows 10/11 (64-bit)
            - .NET 8.0 Runtime (included in self-contained build)
            
            ### License
            GPLv2 - See LICENSE file
          draft: false
          prerelease: false

name: Build and Release VMStart

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install QEMU
        run: brew install qemu

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build VMStart
        run: |
          xcodebuild -project VMStart.xcodeproj \
            -scheme VMStart \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package DMG
        run: |
          mkdir -p dmg
          APP_PATH=$(find build/DerivedData/Build/Products/Release -name "VMStart.app" -maxdepth 1 | head -1)
          DMG_TEMP=$(mktemp -d)
          cp -R "$APP_PATH" "$DMG_TEMP/"
          
          # Copy QEMU binaries into app bundle
          ENGINES_DIR="$DMG_TEMP/VMStart.app/Contents/MacOS/engines"
          mkdir -p "$ENGINES_DIR"
          cp /opt/homebrew/bin/qemu-system-* "$ENGINES_DIR/"
          cp /opt/homebrew/bin/qemu-img "$ENGINES_DIR/"
          chmod +x "$ENGINES_DIR/"*
          
          ln -s /Applications "$DMG_TEMP/Applications"
          VERSION=${GITHUB_REF_NAME:-1.0.0}
          hdiutil create -volname "VMStart" \
            -srcfolder "$DMG_TEMP" \
            -ov -format UDZO \
            "dmg/VMStart-${VERSION}.dmg"
          rm -rf "$DMG_TEMP"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMStart-DMG
          path: dmg/VMStart-*.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dmg/VMStart-*.dmg
          name: "VMStart ${{ github.ref_name }}"
          body: |
            ## VMStart ${{ github.ref_name }}
            
            ### What's New
            - QEMU-based virtual machine manager for macOS
            - Support for 29+ architectures (8-bit AVR to 64-bit x86_64)
            - Native macOS app with Objective-C/Swift frontend
            - Virtual machine library management
            - Built-in console with QEMU monitor access
            
            ### Requirements
            - macOS 14.0 or later
            
            ### Installation
            1. Download the DMG file
            2. Drag VMStart.app to Applications
            3. Launch VMStart (QEMU is included)
            
            ### License
            GPLv2 - See LICENSE file
          draft: false
          prerelease: false

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows EXE
        run: |
          cd VMStart-Windows/VMStart
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../../publish

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMStart-Windows
          path: publish/VMStart.exe

      - name: Create Windows Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: publish/VMStart.exe
          name: "VMStart ${{ github.ref_name }}"
          body: |
            ## VMStart ${{ github.ref_name }} - Windows
            
            ### Installation
            1. Download VMStart.exe
            2. Run the executable
            3. Follow the setup wizard
            
            ### Requirements
            - Windows 10/11 (64-bit)
            - .NET 8.0 Runtime (included in self-contained build)
            
            ### License
            GPLv2 - See LICENSE file
          draft: false
          prerelease: false

name: VMNexus CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ─── macOS Build ───
  build-macos:
    name: macOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build macOS
        run: |
          xcodebuild -project VMNexus.xcodeproj \
            -scheme VMNexus \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            build

      - name: Package DMG
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/VMNexus.app"
          DMG_PATH="build/VMNexus-macOS.dmg"
          mkdir -p build/dmg_staging
          cp -R "$APP_PATH" build/dmg_staging/
          ln -s /Applications build/dmg_staging/Applications
          hdiutil create -volname "VMNexus" \
            -srcfolder build/dmg_staging \
            -ov -format UDZO \
            "$DMG_PATH"
          rm -rf build/dmg_staging

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMNexus-macOS
          path: build/VMNexus-macOS.dmg

  # ─── Windows Build ───
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: VMNexus-Windows
        run: dotnet restore VMNexus.sln

      - name: Build
        working-directory: VMNexus-Windows
        run: dotnet build VMNexus.sln -c Release --no-restore

      - name: Publish
        working-directory: VMNexus-Windows
        run: |
          dotnet publish VMNexus/VMNexus.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64
          dotnet publish VMNexus/VMNexus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64-single

      - name: Package EXE (Inno Setup)
        shell: pwsh
        run: |
          $issContent = @"
          [Setup]
          AppName=VMNexus
          AppVersion=1.0.7
          DefaultDirName={pf}\VMNexus
          DefaultGroupName=VMNexus
          OutputDir=build
          OutputBaseFilename=VMNexus-Windows-Setup
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "VMNexus-Windows\publish\win-x64-single\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{group}\VMNexus"; Filename: "{app}\VMNexus.exe"
          Name: "{commondesktop}\VMNexus"; Filename: "{app}\VMNexus.exe"

          [Run]
          Filename: "{app}\VMNexus.exe"; Description: "Launch VMNexus"; Flags: nowait postinstall skipifsilent
          "@
          $issContent | Out-File -FilePath "VMNexus.iss" -Encoding UTF8

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMNexus-Windows
          path: VMNexus-Windows/publish/win-x64-single/

  # ─── Release (on tags) ───
  release:
    name: Create Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/VMNexus-macOS/VMNexus-macOS.dmg
            artifacts/VMNexus-Windows/**
          generate_release_notes: true

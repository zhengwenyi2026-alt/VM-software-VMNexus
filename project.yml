name: VMNexus
options:
  bundleIdPrefix: com.vmnexus
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    PRODUCT_NAME: VMNexus
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    CLANG_ENABLE_MODULES: YES
    GCC_PREPROCESSOR_DEFINITIONS:
      - "$(inherited)"
    INFOPLIST_FILE: VMNexus/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: VMNexus/Resources/VMNexus.entitlements
    PRODUCT_BUNDLE_IDENTIFIER: com.vmnexus.app
    LD_RUNPATH_SEARCH_PATHS:
      - "$(inherited)"
      - "@executable_path/../Frameworks"
    SWIFT_OBJC_BRIDGING_HEADER: VMNexus/Bridging/VMNexus-Bridging-Header.h

targets:
  VMNexus:
    type: application
    platform: macOS
    sources:
      - path: VMNexus/Sources
      - path: VMNexus/Assets.xcassets
      - path: VMNexus/Resources/en.lproj
        buildPhase: resources
        type: folder
      - path: VMNexus/Resources/zh-Hans.lproj
        buildPhase: resources
        type: folder
    settings:
      base:
        INFOPLIST_FILE: VMNexus/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: VMNexus/Resources/VMNexus.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: VMNexus/Bridging/VMNexus-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: com.vmnexus.app
    info:
      path: VMNexus/Resources/Info.plist
    entitlements:
      path: VMNexus/Resources/VMNexus.entitlements
